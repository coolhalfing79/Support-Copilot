server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed Vite assets if available (gzip)
    gzip_static on;

    # Enable gzip compression for responses
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite hashes asset filenames — cache them aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # For everything else, fall back to index.html
    # This makes client-side routing (React Router, TanStack Router, etc.) work correctly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # API/WebSocket calls are made directly by the browser using runtime config.
    # A standalone SemicoLabs frontend container must not depend on Docker DNS
    # names such as "backend", because frontend and backend are separate apps.
}
