version: "2.4"

services:
  backend:
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://${PUBLIC_HOST},http://${PUBLIC_HOST}:80,http://${PUBLIC_HOST}:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  frontend:
    ports:
      - "80:8000"
    environment:
      - API_BASE_URL=http://${PUBLIC_HOST}:8000/api/v1
      - WS_BASE_URL=ws://${PUBLIC_HOST}:8000/api/v1/chat/ws
    depends_on:
      backend:
        condition: service_started
